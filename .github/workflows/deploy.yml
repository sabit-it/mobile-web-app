name: Build & Deploy

on:
  push:
    branches: [master, main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.19.1'
          cache: 'npm'

      - name: Stub bob and husky
        run: |
          sudo sh -c 'printf "#!/bin/sh\nexit 0\n" > /usr/local/bin/bob && chmod +x /usr/local/bin/bob'
          sudo sh -c 'printf "#!/bin/sh\nexit 0\n" > /usr/local/bin/husky && chmod +x /usr/local/bin/husky'

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npx expo export --platform web

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          provenance: false
          no-cache: true
          tags: ghcr.io/${{ github.repository }}:latest

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker pull ghcr.io/${{ github.repository }}:latest
            docker stop mobile-app || true
            docker rm mobile-app || true
            docker run -d \
              --name mobile-app \
              -p 80:80 \
              -p 443:443 \
              -v /etc/ssl/one-time-work:/etc/ssl/one-time-work:ro \
              --restart unless-stopped \
              ghcr.io/${{ github.repository }}:latest
